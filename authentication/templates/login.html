{% extends "base.html" %}
{% load static %}
{% block title %}Login{% endblock %}
{% block linkCSS %}
<link rel="stylesheet" href="{% static "authentication/login-style.css" %}">
{% endblock %}
{% block content %}
 <div class="login-form-container">
        <!-- Login form -->
        <form method="post" enctype="multipart/form-data" class="login-form-form">
            {% csrf_token %} 
            <h1><span>Login</span></h1>
            <div class="login-image">
                <img src="{% static "authentication/login_logo.svg" %}" alt="login_image">
            </div>
            <!-- Display error/success messages -->
            {% if messages %}
            <div class="alert alert-primary" role="alert">
                {% for message in messages %}
                {{ message }}
                {% endfor %}
            </div>
            {% endif %}

            <!-- Username input field -->
            <div>
                <input type="text" name="username" id="exampleInputEmail1" aria-describedby="emailHelp"
                    placeholder="Enter username" required>
            </div>

            <!-- Password input field -->
            <div>
                <input type="password" name="password" id="exampleInputPassword1" placeholder="Enter Password" required>
            </div>

            <!-- Link to registration page -->
            <p class="login-form-para">Don't have an account <a href="{% url "register" %}">Register</a> </p>

            <!-- Submit button -->
            <button type="submit" >Submit</button>
        </form>
    </div>
{% endblock %}
