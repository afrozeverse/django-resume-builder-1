{% extends "base.html" %}
{% load static %}
{% block title %}Home{% endblock %}

{% block content %}
<section class="hero d-flex flex-column flex-lg-row align-items-center justify-content-between text-center text-lg-start px-4 px-lg-5 py-5">
  
  <!-- Left Content -->
  <div class="hero-text col-lg-6 mb-4 mb-lg-0">
    <h1 class="display-5 fw-bold mb-3">
      Build a professional resume in minutes
    </h1>
    <p class="lead text-muted mb-4">
      Simple, fast, and free — create a standout resume and land your dream job.
    </p>
    <a href="{% url "resumeTemplates" %}" class="btn btn-primary btn-lg px-4 py-2 shadow rounded-pill">
      Get Started
    </a>
  </div>

  <!-- Right Illustration -->
  <div class="hero-img col-lg-6 text-center">
    <img src="{% static 'home/Homepage_illustration.svg' %}" 
         alt="Resume Builder Illustration" 
         class="img-fluid" style="max-height: 400px;">
  </div>

</section>
{% endblock %}
